server {
  listen 80;
  root /usr/share/nginx/html;
  location /api/ { proxy_pass http://relay:8080; proxy_set_header Host $host; }
  location /api/media/ws { proxy_pass http://relay:8080; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; }
  location = /health { proxy_pass http://relay:8080; }
  location / { try_files $uri $uri/ /index.html; }
}
