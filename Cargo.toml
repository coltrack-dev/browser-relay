[workspace]
resolver = "3"
members = [
    "crates/relay-server",
    "crates/browser-runtime",
    "crates/browser-control",
    "crates/session-manager",
    "crates/relay-protocol",
    "crates/media-streaming",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "sync", "net", "io-util", "time"] }
url = "2"
gstreamer = "0.23"
gstreamer-sdp = "0.23"
gstreamer-webrtc = "0.23"
